map $uri $maildesk_perf_route {
 default "other";
 ~^/maildesk/?$ "home";
 ~^/maildesk/api/desk/conversations$ "conversations";
 ~^/maildesk/api/desk/customers/ "customer-detail";
 ~^/maildesk/api/customers/ "customer-work";
 ~^/maildesk/api/send$ "send";
 ~^/maildesk/api/reply-route$ "reply-route";
 ~^/maildesk/api/read$ "read";
 ~^/maildesk/api/desk/order "order";
 ~^/maildesk/api/desk/reply-stats$ "reply-stats";
 ~^/maildesk/api/desk/meta$ "meta";
 ~^/maildesk/api/bootstrap$ "bootstrap";
 ~^/maildesk/auth/ "auth";
 ~^/maildesk/customer-address/ "customer-address";
 ~^/maildesk/desk/ "assets";
}
log_format maildesk_performance escape=json '{"at":"$time_iso8601","request_id":"$request_id","route":"$maildesk_perf_route","method":"$request_method","status":$status,"request_s":"$request_time","upstream_connect_s":"$upstream_connect_time","upstream_header_s":"$upstream_header_time","upstream_response_s":"$upstream_response_time","upstream_status":"$upstream_status","bytes":$body_bytes_sent}';
