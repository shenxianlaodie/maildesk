<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店邮 · 账号管理</title><link rel="stylesheet" href="/style.css"><body><header><strong>店邮 · 账号管理</strong><nav><a href="/">返回收件箱</a> · <a href="/config">系统配置</a></nav></header><main><h1>店铺与邮箱</h1><p>授权提交后自动加密保存在本机，重启无需重填。先添加店铺，再添加对应的邮箱。密钥留空表示保留原授权。</p><p id="notice" role="status"></p><section class="connections"><form id="shop"><h2 id="shop-title">添加店铺</h2><input name="id" type="hidden"><label>店铺名称<input name="name" required maxlength="150"></label><label>店匠域名<input name="domain" required placeholder="example.myshoplaza.com"></label><label>Access Token<input name="token" type="password" autocomplete="off" placeholder="新增必填；编辑留空保留"></label><label class="check"><input name="enabled" type="checkbox" checked>自动同步订单</label><button>保存店铺</button><button type="button" id="shop-reset">取消编辑</button></form><form id="inbox"><h2 id="inbox-title">添加邮箱</h2><input name="id" type="hidden"><label>Zoho 邮箱地址<input name="address" type="email" required></label><label>IMAP 服务器<select name="host"><option>imappro.zoho.com</option><option>imap.zoho.com</option></select></label><label>IMAP 应用专用密码<input name="password" type="password" autocomplete="off" placeholder="新增必填；编辑留空保留"></label><label>SMTP 应用专用密码<input name="smtpPassword" type="password" autocomplete="off" placeholder="配置后可回复；留空保留"></label><p>SMTP 使用 smtppro.zoho.com:465，SSL/TLS。验证连接不会发送邮件。</p><fieldset><legend>对应店铺（可多选）</legend><div id="shop-options"></div></fieldset><label>新顾客默认负责人<select name="staffId"><option value="">未分配</option></select></label><label class="check"><input name="enabled" type="checkbox" checked>自动同步邮件</label><button>保存邮箱</button><button type="button" id="inbox-reset">取消编辑</button></form></section><section class="panel"><h2>已连接账号</h2><div id="account-list">正在加载…</div><p>暂停仅停止后续自动同步，正在执行的同步会完成；历史邮件和订单仍保留。手动同步仍可使用。</p></section></main><script src="/accounts.js"></script></body></html>
